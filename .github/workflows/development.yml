name: development

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Solution
        run: dotnet restore Wrak.CleanBlazor.slnx

      - name: Verify Pinned Package Versions
        shell: pwsh
        run: ./Verify-Package-Versions.ps1

      - name: Build Solution
        run: dotnet build Wrak.CleanBlazor.slnx --configuration $BUILD_CONFIGURATION -p:SourceRevisionId=${{ github.sha }}

      - name: Run Tests
        run: >
          dotnet test Wrak.CleanBlazor.slnx
          --configuration $BUILD_CONFIGURATION
          --no-build
          --report-trx
          --results-directory ${{ runner.temp }}/TestResults

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test Results
          path: '${{ runner.temp }}/TestResults/*.trx'
          reporter: dotnet-trx
