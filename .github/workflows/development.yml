name: development

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Solution
        run: dotnet restore Wrak.CleanBlazor.slnx

      - name: Verify Pinned Package Versions
        shell: pwsh
        run: ./Verify-Package-Versions.ps1

      - name: Build Solution
        run: dotnet build Wrak.CleanBlazor.slnx --configuration $BUILD_CONFIGURATION -p:SourceRevisionId=${{ github.sha }}

      - name: Run Tests
        run: >
          dotnet test Wrak.CleanBlazor.slnx
          --configuration $BUILD_CONFIGURATION
          --no-build
          --report-trx
          --results-directory ${{ runner.temp }}/TestResults

      - name: Filter Empty Test Results
        # dorny/test-reporter's trx parser throws on a .trx with 0 tests (empty
        # <TestDefinitions/>) — a real scenario here since some template test projects
        # (e.g. IntegrationTests) start out empty. Keep those out of its input and note
        # them in the job summary instead, so results still surface without crashing.
        if: success() || failure()
        shell: bash
        run: |
          resultsDir="${{ runner.temp }}/TestResults"
          reportDir="${{ runner.temp }}/TestResultsForReport"
          mkdir -p "$reportDir"
          for trx in "$resultsDir"/*.trx; do
            [ -e "$trx" ] || continue
            total=$(grep -oE 'total="[0-9]+"' "$trx" | head -1 | grep -oE '[0-9]+')
            if [ "${total:-0}" -gt 0 ]; then
              cp "$trx" "$reportDir/"
            else
              echo "- **$(basename "$trx" .trx)**: 0 tests found" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        continue-on-error: true
        with:
          name: Test Results
          path: '${{ runner.temp }}/TestResultsForReport/*.trx'
          reporter: dotnet-trx
          fail-on-empty: false
