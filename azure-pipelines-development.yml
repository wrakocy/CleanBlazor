trigger:  
- dev  

resources:  
- repo: self  

pool:
  vmImage: 'ubuntu-latest'

variables:   
  build.configuration: 'Release'

steps:
- task: UseDotNet@2  
  displayName: 'Use .NET SDK'  
  inputs:  
    packageType: sdk  
    version: '10.0.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore Solution'
  inputs:
    command: 'restore'
    projects: '**/*.slnx'
    feedsToUse: 'config'
    nugetConfigPath: 'nuget.config'

- task: PowerShell@2
  displayName: 'Verify Pinned Package Versions'
  inputs:
    filePath: '$(Build.SourcesDirectory)/Verify-Package-Versions.ps1'
    pwsh: true

- task: DotNetCoreCLI@2  
  displayName: 'Build Solution'  
  inputs:  
    command: 'build'  
    projects: '**/*.slnx'
    arguments: '--configuration $(build.configuration) /p:SourceRevisionId=$(Build.SourceVersion)'  

- task: DotNetCoreCLI@2
  displayName: 'Run Tests'
  inputs:
    command: 'test'
    projects: '**/*Tests.csproj'
    publishTestResults: true
    arguments: '--configuration $(build.configuration) --no-build --report-trx --results-directory $(Agent.TempDirectory)'